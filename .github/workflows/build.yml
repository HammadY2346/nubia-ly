name: RM Tweaks build
on:
  push:
    branches: [rm-tweaks]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Publish build log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -n -E "error:|e: |warning: \[|FAILED|What went wrong|Caused by|\.java:[0-9]+" build.log | head -300 > build-errors.txt || true
          tail -120 build.log >> build-errors.txt
          B64=$(base64 -w0 build-errors.txt)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ci-logs/last-build-errors.txt?ref=rm-tweaks" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/last-build-errors.txt" -f message="ci: build errors ${GITHUB_SHA::7} [skip ci]" -f content="$B64" -f branch=rm-tweaks -f sha="$SHA" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/last-build-errors.txt" -f message="ci: build errors ${GITHUB_SHA::7} [skip ci]" -f content="$B64" -f branch=rm-tweaks >/dev/null
          fi
      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/RMTweaks-$(git rev-parse --short HEAD).apk"
          ls -l out
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RMTweaks-apk
          path: out/*.apk
