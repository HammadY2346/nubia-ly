name: RM Tweaks build
on:
  push:
    branches: [rm-tweaks]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/RMTweaks-$(git rev-parse --short HEAD).apk"
          ls -l out
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RMTweaks-apk
          path: out/*.apk
